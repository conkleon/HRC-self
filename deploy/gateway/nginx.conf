# Supabase API gateway for the HRC Shelf stack.
#
# Port 8000 (published on 127.0.0.1, proxied by the host nginx as
# SUPABASE_PUBLIC_URL) exposes only the two Supabase APIs that Shelf uses:
#   /auth/v1/*    -> auth:9999     (GoTrue)
#   /storage/v1/* -> storage:5000  (Storage API)
# Everything else answers 404, so PostgREST, postgres-meta and Studio are never
# reachable from outside the Docker network.
#
# Port 8080 is internal to the Docker network (not published) and serves the
# OTP email templates that GoTrue downloads when it sends mail.

# Docker's embedded DNS. Upstreams are resolved per request (proxy_pass with
# variables), so nginx starts even if a service is down and follows a
# recreated container to its new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

# Strip the API prefix from the raw request URI. $request_uri is undecoded and
# keeps the query string, so storage object names and signed URL tokens reach
# the upstream byte for byte.
map $request_uri $auth_uri {
    "~^/auth/v1(?<rest>/.*)?$" $rest;
}
map $request_uri $storage_uri {
    "~^/storage/v1(?<rest>/.*)?$" $rest;
}

# The host nginx terminates TLS and sets X-Forwarded-Proto. Keep its value;
# default to http for requests made directly inside the Docker network.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      http;
}

server {
    listen 8000;
    server_name _;

    # Matches FILE_SIZE_LIMIT on the storage service.
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /auth/v1 {
        set $auth_upstream auth:9999;
        proxy_pass http://$auth_upstream$auth_uri;
    }

    location /storage/v1 {
        set $storage_upstream storage:5000;
        # Lets storage build URLs that include the public /storage/v1 prefix.
        proxy_set_header X-Forwarded-Prefix /storage/v1;
        proxy_request_buffering off;
        proxy_pass http://$storage_upstream$storage_uri;
    }

    location / {
        return 404;
    }
}

server {
    listen 8080;
    server_name gateway;

    root /usr/share/nginx/email-templates;
    default_type text/html;

    location / {
        try_files $uri =404;
    }
}
